name: Build syllabus pages

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Confirm master files are present
        run: |
          if [ ! -d masters ]; then
            echo "ERROR: no masters/ folder found at the repository root."
            exit 1
          fi
          count=$(ls masters/*-master.html 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "ERROR: masters/ exists but contains no *-master.html files."
            exit 1
          fi
          echo "Found $count master file(s):"
          ls -1 masters/*-master.html

      - name: Build public pages from masters/
        run: python scripts/build.py

      - name: Commit and push the rebuilt pages, if anything changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build: publish updated syllabus page(s)"
          file_pattern: '*.html'
          commit_user_name: 'syllabus-bot'
          commit_user_email: 'actions@users.noreply.github.com'
